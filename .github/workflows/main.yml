name: Enterprise DevOps Pipeline

on:
  push:
    branches:
      - staging
      - production
      - feature-auth
      - feature-monitoring

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sonarqube:
        image: sonarqube:lts
        ports:
          - 9000:9000

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Project Structure
      run: ls -R

    - name: Build Stage
      run: echo "Building application..."

    - name: Test Stage
      run: echo "Running tests..."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube scanner
      id: cache-sonar-scanner
      uses: actions/cache@v4
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p .sonar/scanner
        wget -O .sonar/scanner/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
        unzip .sonar/scanner/sonar-scanner.zip -d .sonar/scanner/
        mv .sonar/scanner/sonar-scanner-*/* .sonar/scanner/

    - name: Wait for SonarQube
      run: |
        until curl -sSf -u admin:admin http://localhost:9000/api/system/health | grep -q "GREEN"; do
          echo "Waiting for SonarQube..."
          sleep 10
        done

    - name: SonarQube Scan
      run: |
        .sonar/scanner/bin/sonar-scanner \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=admin \
          -Dsonar.password=admin

    - name: Install Conftest
      run: |
        wget https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
        tar xzf conftest_0.55.0_Linux_x86_64.tar.gz
        sudo mv conftest /usr/local/bin

    - name: Run Policy Validation
      run: |
        conftest test configs/deployment.yml --policy policies/

    - name: Deployment Stage
      run: docker compose -f configs/docker-compose.yml up -d

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-logs
        path: .
