apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-app
  labels:
    app: enterprise-app
    environment: development

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-app

  template:
    metadata:
      labels:
        app: enterprise-app

    spec:
      containers:
      - name: nginx-container
        image: nginx:1.25
        ports:
        - containerPort: 80