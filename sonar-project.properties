sonar.projectKey=myproject11
sonar.projectName=Enterprise Platform
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3.8,3.9,3.10,3.11
sonar.exclusions=**/node_modules/**,**/venv/**,**/.git/**,**/*.pyc,**/__pycache__/**,**/logs/**,**/reports/**,**/screenshots/**,**/artifacts/**
sonar.tests=.
sonar.test.inclusions=**/*test*.py,**/*_test.py
sonar.coverage.exclusions=**/test*.py,**/*_test.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true